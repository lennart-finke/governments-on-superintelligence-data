# United Nations speaker registry — Security Council and General Assembly
# verbatim records (intl_un). Split out of the former registry_intl.yaml when
# NATO and the UN stopped sharing one "INTL" jurisdiction; the procedural
# labels ("The President", "The Secretary-General") belong here because they
# only ever appear in UN records.
#
# Those labels carry "UN" in their name even though the records do not: the
# jurisdiction is a column on the tracker, but the worldwide view lists every
# speaker together, and there a bare "The President" reads as some country's
# head of state. The aliases stay verbatim, so matching is unaffected.
- name: UN President
  jurisdiction: UN
  role: Presiding officer, UN Security Council or General Assembly
  description: A rotating procedural title for whoever presides over a United Nations meeting (e.g. Security
    Council or General Assembly session); not tied to one person.
  aliases:
  - The President
  - The President (spoke in Arabic )
  - The President (spoke in Chinese )
  - The President (spoke in Korean; English text provided by the delegation )
- name: UN Acting President
  jurisdiction: UN
  role: Acting presiding officer, UN Security Council or General Assembly
  description: A rotating procedural title for the officer acting as presiding chair of a United Nations
    meeting in the President's absence.
  aliases:
  - The Acting President
  - The Acting President (spoke in French )
- name: UN Secretary-General
  jurisdiction: UN
  role: Secretary-General of the United Nations
  description: The United Nations Secretary-General, the Organization's chief administrative officer;
    the office-holder is not disambiguated in this record.
  aliases:
  - The Secretary-General
