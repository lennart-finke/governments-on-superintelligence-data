# Executive officials the Legislative Yuan gazette records as 姓名 (職稱) -- a
# name and a job title, no ministry and no English. Splitting them out of the
# raw label is worth doing on its own: the title moves into `role`, where the
# site renders it in English beside the name, instead of riding along inside the
# name as "(司長)". Where the official's own ministry publishes an English name,
# that is the canonical; where it does not, the canonical is the native name
# alone, per the rule at the top of this file -- a romanization invented here
# would be a different person's name as often as not.
