# Mexico: canonical registry for Senado de la República speakers.
#
# Only speakers that have produced a quote get an entry, as in
# registry_br.yaml. Aliases are the verbatim speaker_raw strings the
# ingester emits, which prefix the name with the role held at that moment
# -- the same senator chairs a sitting one week ("La Presidenta Senadora
# X") and reads the order paper the next ("La Secretaria Senadora X"), so
# without the alias group one person splits into several speakers. The
# gender-mismatched and lower-case variants ('El Secretaria Senador ...')
# are transcription slips in the source, kept verbatim because that is what
# the linker matches on.
#
# party comes from the Senate's own by-group directory, so it is present
# only for sitting LXVI senators. Members who served earlier and left keep
# their affiliation in the description instead -- over a six-year term it
# can change (Márquez Alvarado was elected on a PAN ticket and sat with the
# PT), and prose can say so where a single `party` value cannot.
#
# profile_url has two shapes because the Senate serves two directories:
# `/66/senador/<id>` for sitting members and
# `/informacion/senadores/LXIV_LXV/<id>/Curricula` for the previous two
# legislatures. Both are live; neither id is guessable from the other.
#
# description is sourced from the Senate's own "Semblanza Curricular" where
# it publishes one, and from Wikidata/Wikipedia otherwise. Three sitting
# senators (Huerta Ladrón de Guevara, Camino Farjat, Martín del Campo) have
# an empty semblanza tab on their official page, hence the second source.
