# Australia speaker registry -- harvested from the Hansard labels.
#
# aph.gov.au writes a floor speaker sort-inverted with a chamber marker
# ("Pocock, Sen David", "Chaney, Kate MP") but writes a minister answering in
# their portfolio in natural order with the office in brackets ("Ed Husic
# (Minister for Industry and Science)"). Those are the same person, so the two
# forms are merged by name; otherwise the UI shows one member twice.
#
# Identity is the MPID carried on each fragment, which is stable and also gives
# the official profile URL. Where a label has no MPID the match falls back to
# given name + surname.
