# Netherlands speaker registry.
#
# Harvested from the speaker labels that actually appear in the NL quotes, the
# way the other jurisdictions' registries were built -- not from a static list
# of sitting members. The previous version only covered currently seated Tweede
# Kamer MPs under the single label shape nl_tweedekamer emits, which left the
# officielebekendmakingen quotes almost entirely unlinked: that source has no
# speaker IDs and writes people as office+surname, initials+surname+office, bare
# surname, or honorific+surname+party -- and many of its speakers are ministers
# or former members who were never in the list at all.
#
# Canonical identity comes from the VLOS <spreker> block (name, fractie,
# functie), which is why ministers appear here alongside members. A surname that
# matches more than one person is left unmatched rather than guessed.
