# Russian keyword list v1 — flat list mirroring readme.md §Search, translated.
# Russian inflects every word of a noun phrase, so most terms use interior stem
# wildcards: "сильн* искусственн* интеллект*" covers сильный искусственный
# интеллект / сильного искусственного интеллекта / сильному… in one line.
# Note "сильный ИИ" (strong AI) — not a literal calque of "AGI" — is the term
# Russian officials and the National AI Strategy actually use for AGI, so it
# carries most of the AGI recall here.
# Precision is the judges' job; this list optimizes recall.
lang: ru
segmented: true
keywords:
  # ИИ generically (just for high recall)
  - ИИ
  - искусственн* интеллект*
  - машинн* интеллект*
  - машинн* обучени*
  - нейросет*
  - нейронн* сет*
  - LLM
  - больш* языков* модел*
  - генеративн* интеллект*
  - генеративн* модел*
  # AGI
  - AGI
  - сильн* искусственн* интеллект*
  - сильн* ИИ
  - общ* искусственн* интеллект*
  - универсальн* искусственн* интеллект*
  - искусственн* интеллект* общего назначения
  - интеллект* человеческого уровня
  - человекоподобн* интеллект*
  - автоматизированн* программировани*
  # ASI
  - ASI
  - сверхразум*
  - сверхинтеллект*
  - суперинтеллект*
  - сверхчеловеческ* интеллект*
  - сверхмощн* когнитивн*
  - умнее человека
  - умнее людей
  - превзойти человеческий интеллект
  - превзойд* человеческий интеллект
  - превосход* человеческий интеллект
  # RSI / рекурсивное самоулучшение
  - RSI
  - рекурсивн* самоулучшени*
  - рекурсивн* самосовершенствовани*
  - самоулучшающ*
  - самосовершенствующ*
  - самообучающ* систем*
  - '*сингулярност*'
  - интеллектуальн* взрыв*
  - взрывн* рост интеллект*
  - автоматизированн* исследовани* ИИ
  # Экзистенциальные / катастрофические риски ИИ
  - экзистенциальн* риск*
  - экзистенциальн* угроз*
  - катастрофическ* риск*
  - катастрофическ* последстви*
  - вымирани* человечества
  - гибел* человечества
  - исчезновени* человечества
  - конец человечества
  - угроз* существованию человечества
  - угроз* человечеству
  - потер* контроля
  - утрат* контроля
  - из-под контроля
  - '*бесконтрольн*'
  - неконтролируем*
  - проблем* контроля
  - контрол* над искусственным интеллектом
  - согласовани* цел*
  - выравнивани* ИИ
  - интерпретируемост*
  - объяснимост*
  - обманчив* поведени*
