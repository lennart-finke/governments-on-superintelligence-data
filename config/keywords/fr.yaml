# French keyword list v2 — flat list mirroring readme.md §Search, translated.
# ASCII apostrophes below also match the typographic ’ used by AN/Sénat records
# (handled in the pattern compiler). "RSI" is omitted: in French records it is
# the Régime social des indépendants.
